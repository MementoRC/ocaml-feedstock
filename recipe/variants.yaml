channel_sources:
  - conda-forge/label/ocaml_experimental,conda-forge/label/zig_experimental,conda-forge
channel_targets:
  - conda-forge ocaml_experimental

c_compiler:
  - if: not unix
    then:
      - vs2022
      - gcc
      - zig

# PR103: restore the local pin deleted by the "(ref) set channels" commit. Without it this
# key falls back to the conda-forge-pinning global default of 15, so the win-64 gcc lane
# solves for `gcc_win-64 15.*` while m2w64-sysroot's run_export demands
# `gcc_win-64 ==14.4.0`, giving "Failed to resolve dependencies". Deliberately NOT
# restoring the other keys that commit removed (c_compiler_version, c_stdlib,
# c_stdlib_version, m2w64_c_stdlib, m2w64_c_stdlib_version, vc) - the vs2022 lane is
# green without them and the solver names only gcc_win-64.
m2w64_c_compiler_version:
  - "14"

cross_target_platform_:
  - linux-64
  - linux-aarch64
  - linux-ppc64le
  - linux-riscv64
  - osx-64
  - osx-arm64
  - win-64
  - win-arm64

ocaml_compiler:
  - ocaml
ocaml_compiler_version:
  - "5.4.0"

zig_compiler:
  - zig
zig_compiler_version:
  - "0.16.0"
