c_compiler:
  - if: not unix
    then:
      - vs2022
      - gcc
      - zig

c_compiler_version:
  - if: not unix
    then:
      - 19

c_stdlib:
  - if: not unix
    then:
      - vs

c_stdlib_version:
  - if: not unix
    then:
      - "2022.14"

m2w64_c_stdlib:
  - m2w64-sysroot

m2w64_c_stdlib_version:
  - 12

m2w64_c_compiler_version:
  - "14"

vc:
  - 14

cross_target_platform_:
  - linux-64
  - linux-aarch64
  - linux-ppc64le
  - linux-riscv64
  - osx-64
  - osx-arm64
  - win-64
  - win-arm64

ocaml_compiler:
  - ocaml
ocaml_compiler_version:
  - "5.4.0"

zig_compiler:
  - zig
zig_compiler_version:
  - "0.16.0"
