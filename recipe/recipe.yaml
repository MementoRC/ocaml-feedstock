context:
  build_number: 7
  name: ocaml
  version: 5.4.0
  flexdll_version: "0.44"

  _c_v: ${{ c_stdlib_version | default("") }}
  
  # runs-on (cross-compiled) and generates-code-for (cross-compilers)
  xc_l64:     ${{ cross_target_platform_ == "linux-64" }}
  xc_aarch64: ${{ cross_target_platform_ == "linux-aarch64" }}
  xc_ppc64le: ${{ cross_target_platform_ == "linux-ppc64le" }}
  xc_riscv64: ${{ cross_target_platform_ == "linux-riscv64" }}
  xc_s390x:   ${{ cross_target_platform_ == "linux-s390x" }}
  xc_o64:     ${{ cross_target_platform_ == "osx-64" }}
  xc_oarm64:  ${{ cross_target_platform_ == "osx-arm64" }}
  xc_w64:     ${{ cross_target_platform_ == "win-64" }}
  xc_warm64:  ${{ cross_target_platform_ == "win-arm64" }}

  xc_lnx:     ${{ "linux" in cross_target_platform_ and "linux" in build_platform }}
  xc_osx:     ${{ "osx"   in cross_target_platform_ and "osx"   in build_platform }}
  xc_nlo:     ${{ "win"   in cross_target_platform_ and "win"   in build_platform }}

  xc_valid:   ${{ xc_lnx or xc_osx or xc_nlo }}
  
  # Derive actual compiler version from c_compiler (global pinning only provides
  # one c_compiler_version per platform, but Windows has 3 compilers)
  actual_c_compiler_version: >-
    ${{
      "19"                          if c_compiler == "vs2022"                                                 else
      "0.15.2"                      if c_compiler == "zig"                                                    else
      "14"                          if c_compiler == "gcc" and not unix                                       else
      c_compiler_version
    }}
  actual_c_stdlib_version: >-
    ${{ 
      "2.39"                      if xc_riscv64                              else
      c_stdlib_version
    }}

  dot: ${{ "./" if unix else "" }}
  library: ${{ "Library/" if not unix else "" }}
  m2: ${{ "m2-" if not unix else "" }}
  sh: ${{ "sh" if unix else "bat" }}
  so: ${{ "so" if unix else "dll" }}
  xt: ${{ "" if unix else ".exe" }}

  # ===========================================================================
  # GCC-style derived values (not variant keys - keeps filenames clean)
  # cross_target_platform_ comes from variants.yaml
  # ===========================================================================
  # Derive triplet from cross_target_platform_
  target_triplet: >-
    ${{
      "x86_64-conda-linux-gnu"      if xc_l64                                     else
      "aarch64-conda-linux-gnu"     if xc_aarch64                                 else
      "powerpc64le-conda-linux-gnu" if xc_ppc64le                                 else
      "riscv64-conda-linux-gnu"     if xc_riscv64                                 else
      "s390x-conda-linux-gnu"       if xc_s390x                                   else
      "x86_64-apple-darwin13.4.0"   if xc_o64                                     else
      "arm64-apple-darwin20.0.0"    if xc_oarm64                                  else
      "x86_64-w64-mingw32"          if xc_w64 and c_compiler in ["gcc", "zig"]    else
      "x86_64-pc-windows"           if xc_w64 and c_compiler == "vs2022"          else
      "aarch64-w64-mingw32"         if xc_warm64 and c_compiler in ["gcc", "zig"] else
      "aarch64-pc-windows"          if xc_warm64 and c_compiler == "vs2022"       else                                                 
      "unknown"
    }}

  # Which platform builds cross-compilers for each target
  cross_build_platform: >-
    ${{
      "linux-64"                    if cross_target_platform_ in [
        "linux-64",
        "linux-ppc64le",
        "linux-riscv64",
        "linux-s390x"
      ]                                                                           else
      "linux-aarch64"               if xc_aarch64                                 else
      "osx-64"                      if xc_o64                                     else
      "osx-arm64"                   if xc_oarm64                                  else
      "win-64"                      if xc_w64 or xc_warm64                        else
      target_platform
    }}

  # ===========================================================================
  # Build case detection helpers (exactly one is true per build)
  # ===========================================================================
  is_native: ${{ cross_target_platform_ == build_platform }}
  is_cross_compiler: ${{ (cross_target_platform_ != target_platform) and (build_platform == cross_build_platform) }}
  is_cross_target: ${{ (cross_target_platform_ == target_platform) and (build_platform != target_platform) }}

  # zig is only for linux-riscv64 and non-unix-arm64 cross-compilation - skip all other zig variants
  skip_zig: ${{ c_compiler == "zig" and not (xc_riscv64 or xc_warm64) }}
  skip_gcc: ${{ c_compiler == "gcc" and (xc_riscv64 or xc_warm64) }}

  # ===========================================================================
  # Debug/Development Settings
  # ===========================================================================
  # Set to "1" to enable progressive build cache in ${RECIPE_DIR}/.build_cache/
  # This caches successful native compiler builds to speed up cross-compiler debugging
  use_cache: "0"

recipe:
  name: ocaml-packages
  version: ${{ version }}

source:
  - url: https://github.com/ocaml/ocaml/archive/refs/tags/${{ version }}.tar.gz
    sha256: 4ab55ac30d247e20f35df20a9f7596e5eb5f92fbbd0f8e3e54838bbc3edf931e
    patches:
      # Fix header include order bug where atomic_load_acquire/atomic_store_release
      # macros are undefined when mlvalues.h is included before platform.h.
      # The macros were guarded by CAML_INTERNALS, but public headers include
      # camlatomic.h, setting the include guard before CAML_INTERNALS is defined.
      - patches/fix-camlatomic-include-order.patch
      # s390x: replace @PLT calls with GOT-indirect calls in the code emitter
      # to avoid glibc PLT lazy-binding trampoline (_dl_runtime_resolve_vx)
      # saving FP regs relative to %r15 (which OCaml uses as fiber stack pointer),
      # corrupting OCaml stack-saved register slots including saved %r10 (Caml_state).
      # Backport of upstream PR #14547 (merged to trunk 2026-03-01, issue #13693).
      - patches/s390x-got-indirect-plt.patch
      # Add aarch64-w64-mingw32 (win-arm64) support to the configure system:
      # - Accepts aarch64-w64-mingw32* as a valid mingw-w64 target/host triple
      # - Adds flexdll_chain='mingw64arm' for flexlink on win-arm64
      # Only apply on Unix - Windows uses flexlink which shouldn't be overridden
      - if: unix
        then: patches/0002-ocamlmklib-conda-env-vars.patch
      - if: not unix
        then:
          - patches/add-aarch64-w64-mingw32-support.patch
          # clang defines __GNUC__ so it matches the MinGW64-specific branch in
          # fail.h that uses intptr_t[5] + __builtin_setjmp/__builtin_longjmp.
          # Clang's __builtin_setjmp on Windows is incompatible → bytecode crash.
          # Exclude clang so it uses standard jmp_buf + setjmp/longjmp instead.
          - patches/fix-clang-mingw64-setjmp.patch
  - if: not unix
    then:
      url: https://github.com/ocaml/flexdll/archive/refs/tags/${{ flexdll_version }}.tar.gz
      sha256: b7c6a92286f1f3065324d51083dcb16eec436a4e6e3b8df7cf836b6d7a8b9491
      target_directory: flexdll
      patches:
        # Add aarch64-w64-mingw32 (win-arm64) support to flexdll:
        # - build_mingw64arm target with MINGW64ARM_PREFIX
        # - windres fallback when cross-windres is not available
        - patches/flexdll-add-mingw64arm-support.patch
  - if: not unix and c_compiler == "vs2022"
    then:
      url: https://github.com/ocaml/winpthreads/archive/d635af4d9bcce7f268b3e3c44f414611bbc66381.tar.gz
      sha256: f390e421dfbc3e5182cbe98832f23c946863349719db9a5439d578875a262193
      target_directory: winpthreads

build:
  number: ${{ build_number }}

outputs:
  # ==========================================================================
  # METAPACKAGE: ocaml
  # Depends on the platform-specific implementation ocaml_${{ cross_target_platform_ }}
  # Only built when cross_target_platform_ == target_platform (alongside native compiler)
  # ==========================================================================
  - package:
      name: ocaml
    build:
      skip: cross_target_platform_ != target_platform or skip_zig or skip_gcc  # or not c_compiler == "zig"
      noarch: generic
      script: echo "OCaml metapackage"
    requirements:
      run:
        - ${{ pin_subpackage("ocaml_" ~ cross_target_platform_, exact=True) }}
      run_exports:
        - ${{ pin_subpackage("ocaml", upper_bound="x.x.x") }}
    tests:
      - package_contents:
          strict: true
      - script:
          - if: build_platform == target_platform
            then: ocaml -version
            else: echo "Skip on cross-compiled platform"

  # ==========================================================================
  # PLATFORM IMPLEMENTATION: ocaml_${{ cross_target_platform_ }}
  #
  # Three mutually exclusive build cases (exactly one applies per build):
  #
  # 1. NATIVE (is_native): cross_target_platform_ == build_platform
  #    Native compiler built on its own platform (e.g., linux-64 on linux-64)
  #
  # 2. CROSS-COMPILER (is_cross_compiler): cross_target_platform_ != target_platform
  #    Cross-compiler built on designated platform (e.g., aarch64 cross on linux-64)
  #    Produces binaries that run on build platform, generate code for cross_target_platform_
  #
  # 3. CROSS-TARGET (is_cross_target): cross_target_platform_ == target_platform AND build != target
  #    Native compiler built via cross-compilation (e.g., aarch64 native built on linux-64)
  #    Produces native binaries for target platform
  # ==========================================================================
  - package:
      name: ocaml_${{ cross_target_platform_ }}
    build:
      string: ${{ c_compiler ~ "_" if not unix }}h${{ hash }}_${{ build_number }}
      script:
        file: build.${{ sh }}
        env:
          SKIP_MAKE_TESTS: "1"
          OCAML_TARGET_PLATFORM: "${{ cross_target_platform_ }}"
          OCAML_TARGET_TRIPLET: "${{ target_triplet }}"
          OCAML_USE_CACHE: "${{ use_cache }}"
      skip: not (is_native or is_cross_compiler or is_cross_target) or skip_zig or skip_gcc  # or not c_compiler == "zig"
      dynamic_linking:
        missing_dso_allowlist:
          - if: is_cross_compiler and xc_aarch64
            then:
              - ld-linux-aarch64.${{ so }}.1
          - if: is_cross_compiler and xc_ppc64le
            then:
              - ld64.${{ so }}.2
          - if: is_cross_compiler and xc_s390x
            then:
              - ld64.${{ so }}.1
          - if: osx
            then:
              - /usr/lib/libSystem.B.dylib
          - if: not unix
            then:
              - C:/Windows/system32/SHLWAPI.dll
              - C:/Windows/system32/VERSION.dll
      prefix_detection:
        force_file_type:
          text:
            # --- NATIVE/CROSS-TARGET: Standard lib paths ---
            - if: is_native or is_cross_target
              then:
                - lib/ocaml/ld.conf
                - lib/ocaml/Makefile.config
                # runtime-launch-info contains a text header with BINDIR path that
                # must be relocated so bytecode shebangs resolve ocamlrun correctly
                - lib/ocaml/runtime-launch-info

            # --- CROSS-COMPILER: Cross-compiler lib paths ---
            - if: is_cross_compiler
              then:
                - lib/ocaml-cross-compilers/*/lib/ocaml/ld.conf
                - lib/ocaml-cross-compilers/*/lib/ocaml/Makefile.config
                - lib/ocaml-cross-compilers/*/lib/ocaml/runtime-launch-info
        ignore:
          # --- NATIVE/CROSS-TARGET: Standard bytecode files ---
          - if: is_native or is_cross_target
            then:
              - bin/ocam{l,lcmt,lcp,ldebug,ldoc,lmklib,lmktop,loptp,lprof}
              - lib/ocaml/**/*.{cmo,cma,cmi,cmx,cmt,cmti}
              - bin/ocaml{c,dep,lex,objinfo,opt}.byte

          # --- CROSS-COMPILER: Cross-compiler bytecode files ---
          - if: is_cross_compiler
            then:
              - lib/ocaml-cross-compilers/*/lib/ocaml/**/*.{cmo,cma,cmi,cmx,cmt,cmti}
              - lib/ocaml-cross-compilers/*/bin/ocam{l,lcmt,lcp,ldebug,ldoc,lmklib,lmktop,loptp,lprof}
              - lib/ocaml-cross-compilers/*/bin/ocaml{c,dep,lex,objinfo,opt}.byte

    # ========================================================================
    # REQUIREMENTS
    # ========================================================================
    requirements:
      ignore_run_exports:
        from_package:
          - if: linux and xc_riscv64
            then:
              - sysroot_${{ cross_target_platform_ }}
      run_exports:
        strong:
          - if: not unix and c_compiler == "gcc"
            then:
              - ${{ stdlib("m2w64_c") }}
          - if: not unix and c_compiler == "vs2022"
            then:
              - ${{ stdlib("c") }}
      build:
        # --- Common build deps (all cases) ---
        - if: not unix and c_compiler in ["gcc", "zig"] or xc_riscv64 and c_compiler == "zig"
          then:
            - if: c_compiler == "zig"
              then:
                - ${{ compiler("zig") }}
                # - ${{ c_compiler }}_${{ build_platform }} ${{ actual_c_compiler_version }}*
              else:
                - ${{ compiler("m2w64_c") }}
                - ${{ stdlib("m2w64_c") }}
          else:
            - ${{ compiler("c") }}
            - ${{ stdlib("c") }}
        - ${{ m2 }}bash >=5.2
        - if: target_platform != "linux-s390x" and target_platform != "linux-riscv64"
          then:
            - ${{ m2 }}file
        - ${{ m2 }}findutils
        - ${{ m2 }}gawk
        - ${{ m2 }}grep
        - ${{ m2 }}make
        - ${{ m2 }}sed
        - ${{ m2 }}tar
        - binutils

        # --- CROSS-COMPILER: Target platform toolchain ---
        # Guard (cross_target_platform_ != build_platform) prevents self-referenced cycle detection
        - if: is_cross_compiler and (cross_target_platform_ != build_platform)
          then:
            - ocaml_${{ build_platform }} >=5.4,<=${{ version }}
            - if: osx
              then:
                - ${{ c_compiler }}_${{ cross_target_platform_ }} ${{ actual_c_compiler_version }}*
            - if: not unix and "arm64" in cross_target_platform_
              then:
                - ${{ c_compiler }}_${{ cross_target_platform_ }} ${{ actual_c_compiler_version }}*
            - if: linux
              then:
                - sysroot_${{ cross_target_platform_ }} ${{ actual_c_stdlib_version }}.*
                - binutils_impl_${{ cross_target_platform_ }}
                - if: xc_riscv64
                  then:
                    - ${{ c_compiler }}_${{ cross_target_platform_ }} ${{ actual_c_compiler_version }}*
                  else:
                    - ${{ c_compiler }}_impl_${{ cross_target_platform_ }} ${{ actual_c_compiler_version }}*

        # --- CROSS-TARGET: Bootstrap compiler for cross-compilation ---
        - if: is_cross_target
          then:
            - ocaml_${{ build_platform }} >=5.4,<=${{ version }}
            
            # Temporary guard since previous s390x cross-compiler does not exist
            - if: target_platform != "linux-s390x" and target_platform != "linux-riscv64"
              then:
                - ocaml_${{ target_platform }} >=5.4,<=${{ version }}

            - if: target_platform != "linux-s390x" and target_platform != "linux-riscv64"
              then:
                - zstd

        # --- non-unix-specific ---
        - if: not unix
          then:
            - ${{ m2 }}coreutils
            - ${{ m2 }}diffutils
            - ${{ m2 }}which

        # --- OSX-specific ---
        - if: osx
          then:
            - lld ${{ actual_c_compiler_version }}*
            - llvm-tools ${{ actual_c_compiler_version }}*

      host:
        - if: target_platform != "linux-s390x" and target_platform != "linux-riscv64"
          then:
            - zstd

      run:
        - if: target_platform != "linux-s390x" and target_platform != "linux-riscv64"
          then:
            - zstd
        # OCaml needs a C compiler at runtime — ocamlopt, conda-ocaml-mkexe,
        # conda-ocaml-mkdll all invoke the C compiler. Must use the activating
        # metapackages (not _impl) because _impl doesn't put tools in PATH.
        - if: is_native or is_cross_target
          then:
            - if: not unix and (c_compiler == "gcc" or c_compiler == "zig") or riscv64 and c_compiler == "zig"
              then:
                - if: c_compiler == "zig"
                  then:
                    - ${{ compiler("zig") }}
                  else:
                    - ${{ compiler("m2w64_c") }}
              else:
                - ${{ compiler("c") }}
            - if: osx
              then:
                - lld >=${{ actual_c_compiler_version }}
                - llvm-tools >=${{ actual_c_compiler_version }}

        # --- CROSS-COMPILER ONLY: Include full toolchain ---
        # Like gcc_linux-aarch64 depends on native gcc, our cross-compiler depends
        # on native OCaml — downstream compiler("ocaml") resolves to the cross-compiler
        # which needs native ocaml/ocamlc in PATH for tools like findlib/dune.
        # Native OCaml for the build platform — can't use pin_subpackage because
        # the build_platform output may not be in the same CI job (e.g., osx cross
        # built on linux). Use version pin instead.
        - if: is_cross_compiler
          then:
            - ocaml_${{ build_platform }} ${{ version }}.*
        - if: is_cross_compiler and (linux or osx)
          then:
            - if: linux
              then:
                - if: c_compiler == "zig"
                  then:
                    - zig_${{ cross_target_platform_ }} >=${{ actual_c_compiler_version }}
                  else:
                    - gcc_impl_${{ cross_target_platform_ }} >=${{ actual_c_compiler_version }}
                    - binutils_impl_${{ cross_target_platform_ }}
              else:
                - clang_impl_${{ cross_target_platform_ }} >=${{ actual_c_compiler_version }}
                - lld >=${{ actual_c_compiler_version }}
                - llvm-tools >=${{ actual_c_compiler_version }}

      run_constraints:
        - if: osx
          then:
            - lld >=${{ actual_c_compiler_version }}

    # ========================================================================
    # TESTS
    # ========================================================================
    tests:
      # ----------------------------------------------------------------------
      # Package contents verification
      # ----------------------------------------------------------------------
      - package_contents:
          # v05_03BP: relax strict for win-arm64 since many install artifacts are
          # empty stubs (SKIP_RUNTIMEOPT_BUILD chain) and won't have predictable layout.
          # strict: true
          bin:
            # NATIVE: Full native toolset
            - if: is_native
              then:
                - conda-ocaml-{ar,as,cc,ld,mkdll,mkexe,ranlib}
                - ocaml
                - ocaml{c,dep,lex,objinfo,opt,mklib,yacc}
                - ocaml{c,dep,lex,objinfo,opt,mklib,yacc}.opt
                - ocaml{c,dep,lex,objinfo,opt}.byte
                - ocaml{cmt,cp,debug,doc,doc.opt,mktop,optp,prof,run,rund}
                - if: unix or c_compiler == "vs2022"
                  then:
                    - ocamlruni
                - if: not unix and c_compiler == "vs2022"
                  then:
                    - default_amd64.manifest
                - if: not unix
                  then:
                    - flexlink
                    - flexlink.byte
                    - flexlink.opt
                    - conda-ocaml-windres

            # CROSS-TARGET: Native toolset (no ocamldebug/ocamldoc)
            - if: is_cross_target
              then:
                - conda-ocaml-{ar,as,cc,ld,mkdll,mkexe,ranlib}
                - ocaml
                - ocaml{c,dep,lex,objinfo,opt,mklib,yacc}
                - ocaml{c,dep,lex,objinfo,opt,mklib,yacc}.opt
                - ocaml{c,dep,lex,objinfo,opt}.byte
                - ocaml{cmt,cp,mktop,optp,prof,run,rund}
                - if: unix
                  then:
                    - ocamlruni

            # CROSS-COMPILER: Prefixed cross tools (non-win-arm64: full toolchain wrappers)
            - if: is_cross_compiler and cross_target_platform_ != "win-arm64"
              then:
                - ${{ target_triplet }}-ocaml{c,dep,lex,objinfo,opt,mklib,yacc}
                - ${{ target_triplet }}-ocaml{c,dep,lex,objinfo,opt,mklib,yacc}.opt
                - ${{ target_triplet }}-ocaml-{ar,as,cc,ld,mkdll,mkexe,ranlib}

            # CROSS-COMPILER win-arm64: only OCaml wrappers (toolchain -cc/-as/etc not present
            # because zig+SKIP_RUNTIMEOPT_BUILD path doesn't generate them)
            - if: is_cross_compiler and xc_warm64
              then:
                - ${{ target_triplet }}-ocaml{c,dep,lex,objinfo,opt,mklib,yacc}
                - ${{ target_triplet }}-ocaml{c,dep,lex,objinfo,opt,mklib,yacc}.opt

          files:
            - etc/conda/test-files/*

            # NATIVE/CROSS-TARGET: Standard layout
            - if: is_native or is_cross_target
              then:
                - etc/conda/activate.d/ocaml_activate.${{ sh }}
                - etc/conda/deactivate.d/ocaml_deactivate.${{ sh }}
                - ${{ library }}lib/ocaml/expunge${{ xt }}
                - ${{ library }}lib/ocaml/ld.conf
                - ${{ library }}lib/ocaml/Makefile.config
                - ${{ library }}lib/ocaml/runtime-launch-info
                - ${{ library }}lib/ocaml/sys.ml.in
                - ${{ library }}lib/ocaml/*.{a,cma,cmi,cmo,cmt,cmti,cmx,cmxa,ml,mli,o}
                - ${{ library }}lib/ocaml/caml/domain_state.tbl
                - ${{ library }}lib/ocaml/caml/*.h
                - ${{ library }}lib/ocaml/{compiler-libs,dynlink,profiling,runtime_events,stdlib,str,threads,unix}/*
                - ${{ library }}lib/ocaml/stublibs/dll*.${{ so }}
                - ${{ library }}share/doc/ocaml/*
                - ${{ library }}share/man/man{1,3}/*
                - if: unix or c_compiler == "gcc"
                  then:
                    - ${{ library }}lib/ocaml/libasmrun.a
                  else:
                    - ${{ library }}lib/ocaml/flexdll/flexdll_initer_msvc64.obj
                    - ${{ library }}lib/ocaml/flexdll/flexdll_msvc64.obj
                    - ${{ library }}lib/ocaml/libasm{run,rund,runi}.lib
                    - ${{ library }}lib/ocaml/libcaml{run,rund,runi}.lib
                    - ${{ library }}lib/ocaml/libcamlruntime_{eventsbyt,eventsnat}.lib
                    - ${{ library }}lib/ocaml/libcamlstr{byt,nat}.lib
                    - ${{ library }}lib/ocaml/libcomprmarsh.lib
                    - ${{ library }}lib/ocaml/libthread{s,snat}.lib
                    - ${{ library }}lib/ocaml/libunix{byt,nat}.lib
                    - ${{ library }}lib/ocaml/std_exit.obj
                    - ${{ library }}lib/ocaml/stdlib.lib
                - if: unix
                  then:
                    - ${{ library }}lib/ocaml/libasmrun_shared.so
                    - ${{ library }}lib/ocaml/libcamlrun_shared.so

            # NATIVE: Also includes ocamldoc directory
            - if: is_native
              then:
                - ${{ library }}lib/ocaml/ocamldoc/*

            # CROSS-COMPILER: Cross-compiler layout (non-win-arm64: Unix-style)
            - if: is_cross_compiler and cross_target_platform_ != "win-arm64"
              then:
                - etc/conda/activate.d/ocaml_cross_activate.sh
                - etc/conda/deactivate.d/ocaml_cross_deactivate.sh
                - lib/ocaml-cross-compilers/${{ target_triplet }}/bin/ocaml{c,dep,lex,objinfo,opt,mklib,yacc}
                - lib/ocaml-cross-compilers/${{ target_triplet }}/bin/ocaml{c,dep,lex,objinfo,opt}.opt
                - lib/ocaml-cross-compilers/${{ target_triplet }}/lib/ocaml/expunge${{ xt }}
                - lib/ocaml-cross-compilers/${{ target_triplet }}/lib/ocaml/ld.conf
                - lib/ocaml-cross-compilers/${{ target_triplet }}/lib/ocaml/libasmrun.a
                - lib/ocaml-cross-compilers/${{ target_triplet }}/lib/ocaml/libasmrun_shared.so
                - lib/ocaml-cross-compilers/${{ target_triplet }}/lib/ocaml/libcamlrun_shared.so
                - lib/ocaml-cross-compilers/${{ target_triplet }}/lib/ocaml/Makefile.config
                - lib/ocaml-cross-compilers/${{ target_triplet }}/lib/ocaml/runtime-launch-info
                - lib/ocaml-cross-compilers/${{ target_triplet }}/lib/ocaml/sys.ml.in
                - lib/ocaml-cross-compilers/${{ target_triplet }}/lib/ocaml/*.{a,cma,cmi,cmo,cmt,cmti,cmx,cmxa,ml,mli,o}
                - lib/ocaml-cross-compilers/${{ target_triplet }}/lib/ocaml/caml/domain_state.tbl
                - lib/ocaml-cross-compilers/${{ target_triplet }}/lib/ocaml/caml/*.h
                - lib/ocaml-cross-compilers/${{ target_triplet }}/lib/ocaml/{compiler-libs,dynlink,profiling,runtime_events,stdlib,str,threads,unix}/*
                - lib/ocaml-cross-compilers/${{ target_triplet }}/lib/ocaml/stublibs/dll*.${{ so }}
                - lib/ocaml-cross-compilers/${{ target_triplet }}/share/doc/ocaml/*
                - lib/ocaml-cross-compilers/${{ target_triplet }}/share/man/man1/*

            # CROSS-COMPILER win-arm64: Windows-style paths (.exe, .lib, no man pages)
            # Many files are empty stubs (allopt skipped); use broad globs to match.
            - if: is_cross_compiler and xc_warm64
              then:
                - etc/conda/activate.d/ocaml_cross_activate.sh
                - etc/conda/deactivate.d/ocaml_cross_deactivate.sh
                - lib/ocaml-cross-compilers/${{ target_triplet }}/bin/ocaml{c,dep,lex,objinfo,opt,mklib,yacc}.exe
                - lib/ocaml-cross-compilers/${{ target_triplet }}/lib/ocaml/Makefile.config
                - lib/ocaml-cross-compilers/${{ target_triplet }}/lib/ocaml/runtime-launch-info
                - lib/ocaml-cross-compilers/${{ target_triplet }}/lib/ocaml/*.{cma,cmi,cmo,cmt,cmti,ml,mli}
                - lib/ocaml-cross-compilers/${{ target_triplet }}/lib/ocaml/caml/*.h

      # ----------------------------------------------------------------------
      # Package integrity: paths, config, env vars, rpath
      # (merged from test-env-paths + test-config)
      # ----------------------------------------------------------------------
      - script:
          - if: is_native
            then: cd testing && ${{ dot }}test-package-integrity.${{ sh }}
          - if: is_cross_target
            then: cd testing && ${{ dot }}test-package-integrity.${{ sh }} cross-target
          - if: is_cross_compiler and cross_target_platform_ != "win-arm64"
            then: cd testing && ${{ dot }}test-package-integrity.${{ sh }} cross ${{ target_triplet }}
          - if: is_cross_compiler and xc_warm64
            then: echo "Skipping test-package-integrity for win-arm64 (no .bat available)"
          - if: not (is_native or is_cross_target or is_cross_compiler)
            then: echo "Invalid artifact" && exit 1
        files:
          recipe:
            - testing/test-package-integrity.${{ sh }}
        requirements:
          run:
            # Use _impl to avoid activation script noise in test output
            - if: unix and target_platform != "linux-riscv64"
              then:
                - binutils_impl_${{ target_platform }}
            # Use native grep on arm64 since no QEMU
            - if: not arm64
              then:
                - if: target_platform != "linux-s390x" and target_platform != "linux-riscv64"
                  then:
                    - ${{ m2 }}file
                    - ${{ m2 }}grep

      # ----------------------------------------------------------------------
      # CROSS-TARGET: Cross-compiled binary architecture verification
      # ----------------------------------------------------------------------
      - script:
          - if: is_cross_target
            then: cd testing && ${{ dot }}test-cross-arch.${{ sh }} ${{ target_platform }}
            else: echo "Native build or cross-compiler - skipping cross-arch check"
        files:
          recipe:
            - testing/test-cross-arch.${{ sh }}
        requirements:
          run:
            - if: unix and target_platform != "linux-riscv64"
              then:
                - binutils_impl_${{ target_platform }}

      # ----------------------------------------------------------------------
      # NATIVE: Tool version checks
      # ----------------------------------------------------------------------
      - script:
          - if: is_native and not arm64
            then: cd testing && ${{ dot }}test-tool-versions.${{ sh }} ${{ version }}
            else: echo "Skipping tool version tests"
        files:
          recipe:
            - testing/test-tool-versions.${{ sh }}
        requirements:
          run:
            # Use native grep on arm64 since no QEMU
            - if: not arm64
              then:
                - if: target_platform != "linux-s390x" and target_platform != "linux-riscv64"
                  then:
                    - ${{ m2 }}grep

      # ----------------------------------------------------------------------
      # NATIVE: Native-only tools test (ocamldoc, ocamldebug)
      # ----------------------------------------------------------------------
      - script:
          - if: is_native and unix
            then: cd testing && ${{ dot }}test-native-only-tools.${{ sh }} ${{ version }}
            else: echo "Skipping native-only tools"
        files:
          recipe:
            - testing/test-native-only-tools.${{ sh }}
        requirements:
          run:
            # Use native grep on arm64 since no QEMU
            - if: not arm64
              then:
                - if: target_platform != "linux-s390x" and target_platform != "linux-riscv64"
                  then:
                    - ${{ m2 }}grep

      # ----------------------------------------------------------------------
      # Compiler wrapper validation (conda-ocaml-cc, conda-ocaml-mkexe)
      # NO extra C compiler test dep — validates that ocaml_$platform's run dep
      # on compiler("c") provides the triplet-prefixed binary.
      # ----------------------------------------------------------------------
      - script:
          - if: is_native and unix and not arm64
            then: cd testing && ${{ dot }}test-compiler-wrappers.${{ sh }}
          - if: is_cross_target
            then: cd testing && ${{ dot }}test-compiler-wrappers.${{ sh }} cross-target
          - if: not (is_native and unix and not arm64) and not is_cross_target
            then: echo "Skipping wrapper tests"
        files:
          recipe:
            - testing/test-compiler-wrappers.sh

      # ----------------------------------------------------------------------
      # CROSS-COMPILER: Activation script tests (ocaml_use_cross/ocaml_use_native)
      # ----------------------------------------------------------------------
      - script:
          - if: is_cross_compiler and cross_target_platform_ != "win-arm64"
            then: cd testing && ${{ dot }}test-cross-activation.${{ sh }}
            else: echo "Skipping cross-activation tests (win-arm64 or non-cross)"
        files:
          recipe:
            - testing/test-cross-activation.sh

      # ----------------------------------------------------------------------
      # CROSS-COMPILER: Functional tests
      # ----------------------------------------------------------------------
      - script:
          - if: is_cross_compiler and cross_target_platform_ != "win-arm64"
            then: |
              cd testing
              ${{ dot }}test-cross-compilers.${{ sh }} ${{ version }} ${{ build_platform }} ${{ target_platform }} ${{ target_triplet }}
            else: echo "Not a cross-compiler package or win-arm64 (skipped)"
        files:
          recipe:
            - testing/test-cross-compilers.sh
        requirements:
          run:
            - if: target_platform != "linux-s390x" and target_platform != "linux-riscv64"
              then:
                - ${{ m2 }}file
            - if: linux
              then:
                - sysroot_${{ cross_target_platform_ }} ${{ actual_c_stdlib_version }}.*

      # - downstream: ${{ "ocaml-dune" if not is_cross_compiler else "none" }}

  # ==========================================================================
  # TOOLCHAIN META-PACKAGE: ocaml-compiler
  # Convenience package: OCaml + binutils (ar, nm, objdump for debugging)
  # C compiler and linker are already run deps of ocaml_$platform
  # ==========================================================================
  - package:
      name: ocaml-compiler
    build:
      skip: cross_target_platform_ != target_platform or skip_zig or skip_gcc  # or not c_compiler == "zig"
      script: echo "Toolchain meta-package"
    requirements:
      run:
        - ${{ pin_subpackage('ocaml', exact=True) }}
        - if: unix or c_compiler == "gcc"
          then:
            - binutils_impl_${{ target_platform }}
    tests:
      # ----------------------------------------------------------------------
      # Package contents (metapackage - only test files)
      # ----------------------------------------------------------------------
      - package_contents:
          strict: true
          files:
            - etc/conda/test-files/ocaml-compiler/*/testing/*

      # ----------------------------------------------------------------------
      # Basic toolchain verification
      # ----------------------------------------------------------------------
      - if: linux and (target_platform == "linux-s390x" or target_platform == "linux-riscv64" or target_platform == "linux-aarch64" or target_platform == "linux-ppc64le")
        then:
          script: |
            # Detect cross-target sysroot via filesystem (target_platform env var is not reliable in rattler-build test phase).
            # If a sysroot for a cross-arch is installed in the test env, point QEMU_LD_PREFIX at it so binfmt_misc/qemu can
            # resolve the target's /lib/ld64.so.1 dynamic linker.
            unset QEMU_LD_PREFIX QEMU_CPU
            for _triplet in s390x-conda-linux-gnu riscv64-conda-linux-gnu aarch64-conda-linux-gnu powerpc64le-conda-linux-gnu; do
                if [ -d "${PREFIX}/${_triplet}/sysroot/lib" ]; then
                    export QEMU_LD_PREFIX="${PREFIX}/${_triplet}/sysroot"
                    case "${_triplet}" in
                        s390x-conda-linux-gnu) export QEMU_CPU="max" ;;
                        powerpc64le-conda-linux-gnu) export QEMU_CPU="power8" ;;
                        *) export QEMU_CPU="max" ;;
                    esac
                    echo "[qemu-cross-exec] QEMU_LD_PREFIX=${QEMU_LD_PREFIX} QEMU_CPU=${QEMU_CPU} (auto-detected via filesystem)"
                    break
                fi
            done
            unset _triplet

            echo ""
            echo "=========================================="
            echo "[DIAG] s390x cross-exec investigation"
            echo "=========================================="

            echo "[DIAG-1] QEMU env state:"
            echo "  QEMU_LD_PREFIX=${QEMU_LD_PREFIX:-<unset>}"
            echo "  QEMU_CPU=${QEMU_CPU:-<unset>}"
            echo "  PREFIX=${PREFIX:-<unset>}"

            echo ""
            echo "[DIAG-2] Sysroot ld64.so.1 existence:"
            ls -la "${QEMU_LD_PREFIX}/lib/ld64.so.1" 2>&1 || echo "  NOT FOUND in lib/"
            ls -la "${QEMU_LD_PREFIX}/lib64/ld64.so.1" 2>&1 || echo "  NOT FOUND in lib64/"

            echo ""
            echo "[DIAG-3] qemu-s390x binary discovery:"
            _qemu_bin=""
            for _c in /usr/libexec/qemu-binfmt/s390x-binfmt-P qemu-s390x-static qemu-s390x qemu-execve-s390x; do
                if command -v "$_c" >/dev/null 2>&1; then
                    _qemu_bin="$_c"
                    echo "  Found: $_c -> $(command -v $_c 2>&1)"
                    break
                fi
            done
            if [ -z "${_qemu_bin}" ]; then
                echo "  No qemu-s390x binary discovered in PATH; binfmt_misc will be used via kernel registration"
            else
                "${_qemu_bin}" --version 2>&1 | head -3 || echo "  qemu --version failed"
            fi

            echo ""
            echo "[DIAG-4] Direct invocation of ld64.so.1 (simplest s390x binary):"
            if [ -x "${QEMU_LD_PREFIX}/lib/ld64.so.1" ]; then
                "${QEMU_LD_PREFIX}/lib/ld64.so.1" --version 2>&1 | head -5 || echo "  ld64.so.1 --version FAILED (exit $?)"
            fi

            echo ""
            echo "[DIAG-5] readelf -l on ocamlopt (interp path):"
            _ocamlopt_path="$(command -v ocamlopt${{ xt }} 2>/dev/null || echo unknown)"
            echo "  ocamlopt resolves to: ${_ocamlopt_path}"
            if [ -f "${_ocamlopt_path}" ]; then
                if command -v readelf >/dev/null 2>&1; then
                    readelf -l "${_ocamlopt_path}" 2>&1 | grep -A1 -E '(INTERP|Requesting program)' | head -10
                fi
                if command -v file >/dev/null 2>&1; then
                    file "${_ocamlopt_path}" 2>&1
                fi
            fi

            echo ""
            echo "[DIAG-6] Try ocamlopt with QEMU_STRACE=1 (last 40 lines):"
            QEMU_STRACE=1 ocamlopt${{ xt }} -version 2>&1 | tail -40 || echo "  ocamlopt with strace exit: $?"

            echo ""
            echo "[DIAG-7] Bare ocamlopt -version (the original failing call):"
            ocamlopt${{ xt }} -version || echo "  Bare ocamlopt -version exit: $?"

            echo ""
            echo "[DIAG-8] conda-forge qemu-execve-s390x (v11+) test:"
            _qe_bin="$(command -v qemu-execve-s390x 2>/dev/null || true)"
            if [ -z "${_qe_bin}" ]; then
                # Fallback discovery in BUILD_PREFIX and $PREFIX
                for _candidate in "${BUILD_PREFIX}/bin/qemu-execve-s390x" "${PREFIX}/bin/qemu-execve-s390x" "${BUILD_PREFIX}/libexec/qemu-execve/qemu-execve-s390x" "${PREFIX}/libexec/qemu-execve/qemu-execve-s390x"; do
                    if [ -x "${_candidate}" ]; then
                        _qe_bin="${_candidate}"
                        break
                    fi
                done
            fi
            echo "  qemu-execve-s390x location: ${_qe_bin:-<not found>}"
            if [ -z "${_qe_bin}" ]; then
                echo "  Listing BUILD_PREFIX/bin entries matching qemu-execve*:"
                ls -la "${BUILD_PREFIX}/bin/" 2>/dev/null | grep -i qemu || echo "  none"
                echo "  qemu-execve not installed — check requirements block"
            fi
            if [ -n "${_qe_bin}" ]; then
                "${_qe_bin}" --version 2>&1 | head -3 || echo "  --version failed"
                echo ""
                echo "  [DIAG-8a] Invoke ld64.so.1 via qemu-execve:"
                "${_qe_bin}" "${QEMU_LD_PREFIX}/lib/ld64.so.1" --version 2>&1 | head -5 || echo "  ld64.so.1 via qemu-execve exit: $?"
                echo ""
                echo "  [DIAG-8b] Invoke ocamlopt via qemu-execve:"
                "${_qe_bin}" "$(command -v ocamlopt${{ xt }})" -version 2>&1 | tail -10 || echo "  ocamlopt via qemu-execve exit: $?"
                echo ""
                echo "  [DIAG-8c] Invoke ocamlopt via qemu-execve with strace:"
                QEMU_STRACE=1 "${_qe_bin}" "$(command -v ocamlopt${{ xt }})" -version 2>&1 | tail -50 || echo "  with-strace exit: $?"
            else
                echo "  qemu-execve not installed — check requirements block"
            fi

            echo ""
            echo "[DIAG-9] ocamlrun ELF header (confirm s390x binary):"
            _ocamlrun_path=""
            if [ -x "${PREFIX}/bin/ocamlrun" ]; then
                _ocamlrun_path="${PREFIX}/bin/ocamlrun"
            elif [ -x "${PREFIX}/lib/ocaml/ocamlrun" ]; then
                _ocamlrun_path="${PREFIX}/lib/ocaml/ocamlrun"
            fi
            if [ -n "${_ocamlrun_path}" ]; then
                echo "  ocamlrun found at: ${_ocamlrun_path}"
                readelf -h "${_ocamlrun_path}" 2>&1 | head -5 || echo "  readelf failed (exit $?)"
            else
                echo "  ocamlrun NOT FOUND in \$PREFIX/bin or \$PREFIX/lib/ocaml"
            fi

            echo ""
            echo "[DIAG-10] Bare ocamlrun --version (via binfmt):"
            if [ -n "${_ocamlrun_path}" ]; then
                "${_ocamlrun_path}" --version 2>&1 || true
                echo "exit: $?"
            else
                echo "  skipped - ocamlrun not found"
            fi

            echo ""
            echo "[DIAG-11] ocamlrun --version via qemu-execve-s390x:"
            if [ -n "${_qe_bin}" ] && [ -n "${_ocamlrun_path}" ]; then
                "${_qe_bin}" "${_ocamlrun_path}" --version 2>&1 || true
                echo "exit: $?"
            else
                echo "  skipped - qemu-execve or ocamlrun not found"
            fi

            echo ""
            echo "[DIAG-12] ocamlrun --version via qemu-execve-s390x with QEMU_STRACE=1:"
            if [ -n "${_qe_bin}" ] && [ -n "${_ocamlrun_path}" ]; then
                QEMU_STRACE=1 "${_qe_bin}" "${_ocamlrun_path}" --version 2>&1 | tail -30 || true
                echo "exit: $?"
            else
                echo "  skipped - qemu-execve or ocamlrun not found"
            fi

            echo ""
            echo "[DIAG-13] ocamlc.opt ELF header:"
            _ocamlc_opt_path=""
            if [ -x "${PREFIX}/bin/ocamlc.opt" ]; then
                _ocamlc_opt_path="${PREFIX}/bin/ocamlc.opt"
            elif [ -x "${PREFIX}/bin/ocamlc.byte" ]; then
                _ocamlc_opt_path="${PREFIX}/bin/ocamlc.byte"
            elif [ -x "${PREFIX}/bin/ocamlc" ]; then
                _ocamlc_opt_path="${PREFIX}/bin/ocamlc"
            fi
            echo "  ocamlc.opt discovered path: ${_ocamlc_opt_path:-<not found>}"
            if [ -n "${_ocamlc_opt_path}" ]; then
                readelf -h "${_ocamlc_opt_path}" 2>&1 | head -5 || echo "  readelf failed (exit $?)"
            fi

            echo ""
            echo "[DIAG-13b] ocamlc.opt -version via qemu-execve-s390x:"
            if [ -n "${_qe_bin}" ] && [ -n "${_ocamlc_opt_path}" ]; then
                set +e
                "${_qe_bin}" "${_ocamlc_opt_path}" -version
                _rc=$?
                set -e
                echo "  ocamlc.opt -version exit: ${_rc}"
            else
                echo "  skipped - qemu-execve or ocamlc.opt not found"
            fi

            echo ""
            echo "[DIAG-13c] ocamlc.opt -version via qemu-execve-s390x with QEMU_STRACE=1 (tail -20):"
            if [ -n "${_qe_bin}" ] && [ -n "${_ocamlc_opt_path}" ]; then
                set +e
                QEMU_STRACE=1 "${_qe_bin}" "${_ocamlc_opt_path}" -version 2>&1 | tail -20
                _rc=$?
                set -e
                echo "  ocamlc.opt strace exit: ${_rc}"
            else
                echo "  skipped - qemu-execve or ocamlc.opt not found"
            fi

            echo ""
            echo "[DIAG-14] ocaml ELF header:"
            _ocaml_path="${PREFIX}/bin/ocaml"
            echo "  ocaml path: ${_ocaml_path}"
            if [ -x "${_ocaml_path}" ]; then
                readelf -h "${_ocaml_path}" 2>&1 | head -5 || echo "  readelf failed (exit $?)"
            else
                echo "  ${_ocaml_path} not found or not executable"
            fi

            echo ""
            echo "[DIAG-14b] ocaml -version via qemu-execve-s390x:"
            if [ -n "${_qe_bin}" ] && [ -x "${_ocaml_path}" ]; then
                set +e
                "${_qe_bin}" "${_ocaml_path}" -version
                _rc=$?
                set -e
                echo "  ocaml -version exit: ${_rc}"
            else
                echo "  skipped - qemu-execve or ocaml not found"
            fi

            echo ""
            echo "[DIAG-15] ocamlopt -version with QEMU_LOG=in_asm (last 80 lines):"
            if [ -n "${_qe_bin}" ]; then
                _ocamlopt_path="$(command -v ocamlopt 2>/dev/null || true)"
                if [ -z "${_ocamlopt_path}" ] && [ -x "${PREFIX}/bin/ocamlopt" ]; then
                    _ocamlopt_path="${PREFIX}/bin/ocamlopt"
                fi
                if [ -n "${_ocamlopt_path}" ]; then
                    set +e
                    QEMU_LOG=in_asm QEMU_LOG_FILENAME=/tmp/qemu-s390x-crash.log \
                        "${_qe_bin}" "${_ocamlopt_path}" -version >/dev/null 2>&1
                    _rc=$?
                    set -e
                    echo "  ocamlopt qemu-log exit: ${_rc}"
                    echo "  ---- /tmp/qemu-s390x-crash.log tail -400 ----"
                    tail -400 /tmp/qemu-s390x-crash.log 2>&1 || echo "  (log file not created)"
                    echo "  ---- end log tail ----"
                    echo "  ---- IN: blocks referencing 0x2aa00aa0dc8 (if present) ----"
                    grep -B 1 -A 30 -E "0x[0]*2aa00aa0dc[0-9a-f]" /tmp/qemu-s390x-crash.log 2>/dev/null | head -100 || echo "  (target address not in log)"
                    echo "  ---- end address grep ----"
                else
                    echo "  skipped - ocamlopt not found"
                fi
            else
                echo "  skipped - qemu-execve not found"
            fi

            echo ""
            echo "[DIAG-16] Symbol lookup near crash target 0x2aa00aa0dc8:"
            echo "  [DIAG-16a] caml_apply / caml_curry / caml_tuplify symbols in ocamlopt:"
            nm $PREFIX/bin/ocamlopt 2>/dev/null | grep -E "caml_(apply|curry|tuplify)" | sort | head -40 || echo "  (nm failed)"
            echo "  [DIAG-16b] Symbol nearest 0x2aa00aa0dc8 (numerical sort, +/- 0x10000):"
            nm -n $PREFIX/bin/ocamlopt 2>/dev/null | awk '
              /^[0-9a-f]+ [TtWw] / {
                addr = strtonum("0x" $1)
                target = strtonum("0x2aa00aa0dc8")
                diff = addr - target
                if (diff < 0) diff = -diff
                if (diff < 65536) print $0
              }' | head -10 || echo "  (awk lookup failed)"
            echo "  [DIAG-16c] readelf .text section VMA (to confirm address translation):"
            readelf -S $PREFIX/bin/ocamlopt 2>/dev/null | grep -E "Nr|\.text " | head -5 || echo "  (readelf failed)"
            echo "  [DIAG-16d] objdump disassembly at 0x2aa00aa0dc8 (next 20 instructions):"
            objdump -d --start-address=0x2aa00aa0dc8 --stop-address=0x2aa00aa0e30 $PREFIX/bin/ocamlopt 2>/dev/null | head -40 || echo "  (objdump failed)"

            echo ""
            echo "[DIAG-17] Static-address disassembly via symbol name (correct address translation):"
            echo "  [DIAG-17a] nm hits for camlStdlib__Hashtbl symbols (the crash function):"
            nm $PREFIX/bin/ocamlopt 2>/dev/null | grep -E "camlStdlib__Hashtbl" | head -20 || echo "  (none found)"
            echo "  [DIAG-17b] objdump of camlStdlib__Hashtbl add function (60 instructions):"
            _hashtbl_add=$(nm $PREFIX/bin/ocamlopt 2>/dev/null | grep -E "camlStdlib__Hashtbl.*add" | head -1 | awk '{print "0x"$1}')
            echo "    resolved static address: $_hashtbl_add"
            if [ -n "$_hashtbl_add" ]; then
              _end=$(printf "0x%x" $((_hashtbl_add + 0x100)))
              objdump -d --target=elf64-s390 --start-address=$_hashtbl_add --stop-address=$_end $PREFIX/bin/ocamlopt 2>/dev/null | head -80 || echo "    (objdump failed)"
            fi
            echo "  [DIAG-17c] nm hits for camlWarnings symbols (caller):"
            nm $PREFIX/bin/ocamlopt 2>/dev/null | grep -E "camlWarnings\.(entry|fun_)" | head -20 || echo "  (none found)"
            echo "  [DIAG-17d] objdump of camlWarnings.entry (40 instructions — shows r10 setup if any):"
            _warn_entry=$(nm $PREFIX/bin/ocamlopt 2>/dev/null | grep -E "camlWarnings\.entry" | head -1 | awk '{print "0x"$1}')
            echo "    resolved static address: $_warn_entry"
            if [ -n "$_warn_entry" ]; then
              _wend=$(printf "0x%x" $((_warn_entry + 0xa0)))
              objdump -d --target=elf64-s390 --start-address=$_warn_entry --stop-address=$_wend $PREFIX/bin/ocamlopt 2>/dev/null | head -60 || echo "    (objdump failed)"
            fi

            echo ""
            echo "[DIAG-18] OCaml runtime entry-point disassembly (does it set up %r10?):"
            echo "  [DIAG-18a] Runtime entry/trampoline symbols:"
            nm $PREFIX/bin/ocamlopt 2>/dev/null | grep -E "^[0-9a-f]+ [TtWw] (caml_start_program|caml_call_gc|caml_callback|caml_main|caml_raise_exn|caml_program|caml_c_call|caml_startup)" | head -30 || echo "  (none found)"
            echo "  [DIAG-18b] objdump of caml_start_program (80 instructions — should load Caml_state into %r10):"
            _csp=$(nm $PREFIX/bin/ocamlopt 2>/dev/null | grep -E "^[0-9a-f]+ [TtWw] caml_start_program( |$)" | head -1 | awk '{print "0x"$1}')
            echo "    resolved static address: $_csp"
            if [ -n "$_csp" ]; then
              _cspend=$(printf "0x%x" $((_csp + 0x200)))
              objdump -d --target=elf64-s390 --start-address=$_csp --stop-address=$_cspend $PREFIX/bin/ocamlopt 2>/dev/null | head -120 || echo "    (objdump failed)"
            fi
            echo "  [DIAG-18c] Search for any 'Caml_state' / 'caml_state' / 'caml_domain_state' symbol:"
            nm $PREFIX/bin/ocamlopt 2>/dev/null | grep -iE "caml_(state|domain_state|main_domain)" | head -20 || echo "  (none found)"
            echo "  [DIAG-18d] Disassembly grep — any 'lg %r10' or 'lgr %r10' in the binary (top 30 hits):"
            objdump -d --target=elf64-s390 $PREFIX/bin/ocamlopt 2>/dev/null | grep -E "(lg|lgr|larl)\s+%r10," | head -30 || echo "  (none — strong signal that r10 is never explicitly loaded)"

            echo ""
            echo "[DIAG-19] caml_main and caml_program disassembly (fallback if caml_start_program is hidden):"
            echo "  [DIAG-19a] caml_main (the C-side runtime entry, 80 instructions):"
            _cm=$(nm $PREFIX/bin/ocamlopt 2>/dev/null | grep -E "^[0-9a-f]+ [TtWw] caml_main( |$)" | head -1 | awk '{print "0x"$1}')
            echo "    resolved static address: $_cm"
            if [ -n "$_cm" ]; then
              _cmend=$(printf "0x%x" $((_cm + 0x200)))
              objdump -d --target=elf64-s390 --start-address=$_cm --stop-address=$_cmend $PREFIX/bin/ocamlopt 2>/dev/null | head -100 || echo "    (objdump failed)"
            fi
            echo "  [DIAG-19b] caml_program (the OCaml main entry):"
            _cprog=$(nm $PREFIX/bin/ocamlopt 2>/dev/null | grep -E "^[0-9a-f]+ [TtWw] caml_program( |$)" | head -1 | awk '{print "0x"$1}')
            echo "    resolved static address: $_cprog"
            if [ -n "$_cprog" ]; then
              _cpend=$(printf "0x%x" $((_cprog + 0x100)))
              objdump -d --target=elf64-s390 --start-address=$_cprog --stop-address=$_cpend $PREFIX/bin/ocamlopt 2>/dev/null | head -60 || echo "    (objdump failed)"
            fi
            echo "  [DIAG-19c] Hashtbl_add static disassembly (retry with --target=elf64-s390, prologue only):"
            _ha=0xa9f348
            _haend=$(printf "0x%x" $((_ha + 0x80)))
            objdump -d --target=elf64-s390 --start-address=$_ha --stop-address=$_haend $PREFIX/bin/ocamlopt 2>/dev/null | head -40 || echo "    (objdump failed)"

            echo ""
            echo "=========================================="
            echo "[DIAG] end investigation"
            echo "=========================================="

            # Don't fail the test (we want to see all diagnostic output)
            exit 0
          requirements:
            build:
              - if: linux and not (x86_64 or aarch64)
                then:
                  - qemu-execve-${{ target_platform | replace("linux-", "") }}
            run:
              - if: linux
                then:
                  - sysroot_${{ cross_target_platform_ }} ${{ actual_c_stdlib_version }}.*

      # ----------------------------------------------------------------------
      # Compilation tests (requires C toolchain)
      # Linux cross-targets can run via QEMU, only osx-arm64 cross skipped
      # ----------------------------------------------------------------------
      - script:
          - if: not arm64 and target_platform != "linux-s390x" and target_platform != "linux-riscv64"
            then: cd testing && ${{ dot }}test-compilation.${{ sh }} ${{ version }}
            else: echo "Skipping compilation tests (osx-arm64 cross-target, no QEMU)"
        files:
          recipe:
            - testing/test-compilation.${{ sh }}
        requirements:
          run:
            - if: target_platform != "linux-s390x" and target_platform != "linux-riscv64"
              then:
                - ${{ m2 }}file
                - ${{ m2 }}grep
            - if: linux
              then:
                - sysroot_${{ cross_target_platform_ }} ${{ actual_c_stdlib_version }}.*

      # ----------------------------------------------------------------------
      # CONDA_OCAML_* toolchain variable tests
      # Linux cross-targets can run via QEMU, only osx-arm64 cross skipped
      # ----------------------------------------------------------------------
      - script:
          - if: not arm64 and target_platform != "linux-s390x" and target_platform != "linux-riscv64"
            then: cd testing && ${{ dot }}test-toolchain-vars.${{ sh }}
            else: echo "Skipping toolchain var tests (osx-arm64 cross-target, no QEMU)"
        files:
          recipe:
            - testing/test-toolchain-vars.${{ sh }}
        requirements:
          run:
            - if: target_platform != "linux-s390x" and target_platform != "linux-riscv64"
              then:
                - ${{ m2 }}grep
            - if: linux
              then:
                - sysroot_${{ cross_target_platform_ }} ${{ actual_c_stdlib_version }}.*

