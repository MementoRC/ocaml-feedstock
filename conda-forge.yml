azure:
  settings_linux:
    swapfile_size: 10GiB
  settings_win:
    swapfile_size: 10GiB
build_platform:
  linux_ppc64le: linux_64  
  linux_s390x: linux_64  
  linux_riscv64: linux_64
  win_arm64: win_64
conda_build:
  error_overlinking: true
conda_build_tool: rattler-build
conda_forge_output_validation: false
conda_install_tool: pixi
github:
  branch_name: main
  tooling_branch_name: main
linter:
  skip:
    - lint_stdlib
os_version: { linux_riscv64: alma10 }
provider:
  linux_aarch64: default
  osx_arm64: default
  win_arm64: null
test: all
workflow_settings:
  build_workspace_dir:
    - os: win
      value: C:\bld
  free_disk_space: quick
  pagefile_size:
    - value: 16
      os: win
