conda_build_tool: rattler-build
conda_install_tool: pixi
github:
  branch_name: main
  tooling_branch_name: main
conda_build:
  error_overlinking: true
# v05_03BT: temporarily disabled for win-arm64 development; ocaml_win-arm64 is
# not yet registered in conda-forge/feedstock-outputs. RE-ENABLE before merging
# upstream (will require admin PR to conda-forge/feedstock-outputs first).
conda_forge_output_validation: false
build_platform:
  linux_aarch64: linux_64
  linux_ppc64le: linux_64  
  osx_arm64: osx_64
  # win_arm64: win_64
provider:
  linux_aarch64: default
  linux_ppc64le: default
  osx_arm64: default
  # win_arm64: default
test: all
linter:
  skip:
    - lint_stdlib
